schema: code-aligned

references:
  - audio-vue

rules:
  proposal:
    - Under Impact, name each spec of a referenced project (`references:` above) this change relies on, as `<store>:<spec-id>`, or say none.
    - Write no compatibility, migration or version-bump sections, options or caveats. The app supports only the saved contract's host API (`.claude/CLAUDE.md`, "Host Versions").
  specs:
    - Record no API or schema version numbers in a requirement or its source line; say where the current one is read. Example versions in scenarios are fine.
  alignment:
    - Read each referenced spec the proposal names in full (`openspec show <spec-id> --type spec --store <store>`), and check every requirement the plan relies on says what the plan assumes. Check that project's open changes (`openspec list --store <store>`, then `openspec show <change> --type change --store <store> --json --deltas-only`) for a delta to it; one is a finding, since it can change under the plan.
    - Where this change modifies a spec of ours that a referenced project's open change names under its Impact, that is a finding too, so the maintainer knows to tell that project's session.

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
